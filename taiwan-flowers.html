<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台灣花卉圖鑑與栽培指南 | Taiwan Flowers Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f5f0;
      --surface: #ffffff;
      --primary: #2d5a42;
      --primary-light: #e7f0ea;
      --accent: #c86d51;
      --text: #262a27;
      --muted: #666e68;
      --border: #e3dfd7;
      --shadow: 0 8px 24px rgba(34, 48, 38, 0.08);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    /* Header / Hero */
    header {
      background: linear-gradient(135deg, #214432 0%, #3a6b50 60%, #527962 100%);
      color: #fff;
      padding: 3.5rem 1.5rem 2.75rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    header::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.12), transparent 45%),
                  radial-gradient(circle at 80% 80%, rgba(255, 224, 178, 0.12), transparent 40%);
      pointer-events: none;
    }

    .hero-inner {
      max-width: 900px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .hero-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(6px);
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      margin-bottom: 1rem;
    }

    header h1 {
      font-family: "Noto Serif TC", serif;
      font-size: clamp(1.8rem, 4vw, 2.7rem);
      font-weight: 700;
      margin-bottom: 0.75rem;
      letter-spacing: 0.03em;
    }

    header p {
      color: rgba(255, 255, 255, 0.88);
      font-size: 1rem;
      max-width: 650px;
      margin: 0 auto;
    }

    /* Controls */
    .controls-wrapper {
      max-width: 1240px;
      margin: -1.5rem auto 2rem;
      padding: 0 1.25rem;
      position: relative;
      z-index: 2;
    }

    .controls-bar {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.15rem 1.4rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--border);
    }

    .search-box {
      flex: 1 1 260px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 0.65rem 1rem 0.65rem 2.4rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #fbfaf7;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(45, 90, 66, 0.12);
      background: #fff;
    }

    .search-icon {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 0.95rem;
      pointer-events: none;
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .filter-btn {
      border: 1px solid var(--border);
      background: #fbfaf7;
      color: var(--text);
      padding: 0.45rem 0.95rem;
      border-radius: 999px;
      font-size: 0.88rem;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .filter-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .stats-bar {
      max-width: 1240px;
      margin: 0 auto 1.25rem;
      padding: 0 1.4rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    /* Grid */
    main {
      max-width: 1240px;
      margin: 0 auto 4rem;
      padding: 0 1.25rem;
    }

    .flower-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
    }

    .card-img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #eceae4;
      overflow: hidden;
    }

    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease;
    }

    .card:hover .card-img-wrap img {
      transform: scale(1.04);
    }

    .img-fallback {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      text-align: center;
      background: linear-gradient(145deg, #e9eee9, #f4f1ea);
      color: var(--muted);
      font-size: 0.85rem;
      gap: 0.45rem;
    }

    .img-fallback.visible {
      display: flex;
    }

    .upload-photo-btn {
      position: absolute;
      bottom: 0.65rem;
      right: 0.65rem;
      background: rgba(255, 255, 255, 0.92);
      color: var(--text);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 999px;
      padding: 0.3rem 0.7rem;
      font-size: 0.75rem;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s, background 0.2s;
      z-index: 2;
      font-family: inherit;
    }

    .card-img-wrap:hover .upload-photo-btn,
    .img-fallback.visible ~ .upload-photo-btn {
      opacity: 1;
    }

    .upload-photo-btn:hover {
      background: #fff;
      color: var(--primary);
    }

    .card-tag {
      position: absolute;
      top: 0.75rem;
      left: 0.75rem;
      background: rgba(33, 68, 50, 0.85);
      color: #fff;
      font-size: 0.75rem;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      backdrop-filter: blur(4px);
    }

    .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-title-row {
      margin-bottom: 0.85rem;
    }

    .card-zh {
      font-family: "Noto Serif TC", serif;
      font-size: 1.32rem;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.3;
    }

    .card-en {
      font-size: 0.88rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    .card-sci {
      font-style: italic;
      font-size: 0.8rem;
      color: #8b938d;
    }

    .specs-list {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      margin-bottom: 1rem;
      flex: 1;
    }

    .spec-item {
      display: grid;
      grid-template-columns: 82px 1fr;
      gap: 0.5rem;
      font-size: 0.87rem;
      align-items: start;
      padding-bottom: 0.45rem;
      border-bottom: 1px dashed #eeebe4;
    }

    .spec-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .spec-label {
      font-weight: 600;
      color: #49524b;
      white-space: nowrap;
    }

    .spec-value {
      color: var(--text);
    }

    .detail-btn {
      width: 100%;
      padding: 0.6rem 1rem;
      background: var(--primary-light);
      color: var(--primary);
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .detail-btn:hover {
      background: var(--primary);
      color: #fff;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(19, 28, 22, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-content {
      background: var(--surface);
      border-radius: 20px;
      max-width: 780px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.22);
      position: relative;
      animation: modalIn 0.22s ease-out;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.92);
      color: var(--text);
      font-size: 1.25rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .modal-img {
      width: 100%;
      max-height: 380px;
      object-fit: cover;
      display: block;
      background: #eceae4;
    }

    .modal-body {
      padding: 1.75rem;
    }

    .modal-title {
      font-family: "Noto Serif TC", serif;
      font-size: 1.75rem;
      color: var(--primary);
    }

    .modal-subtitle {
      color: var(--muted);
      margin-bottom: 1.25rem;
      font-size: 0.95rem;
    }

    .modal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.9rem;
      margin-bottom: 1.25rem;
    }

    .modal-box {
      background: #f8f7f3;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.85rem 1rem;
    }

    .modal-box h4 {
      font-size: 0.85rem;
      color: var(--primary);
      margin-bottom: 0.25rem;
    }

    .modal-box p {
      font-size: 0.9rem;
      color: var(--text);
    }

    .modal-notes {
      background: var(--primary-light);
      border-radius: 12px;
      padding: 1rem 1.2rem;
      font-size: 0.92rem;
      color: #214432;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3.5rem 1rem;
      color: var(--muted);
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px dashed var(--border);
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
      background: #f2efe9;
    }

    @media (max-width: 600px) {
      .spec-item {
        grid-template-columns: 76px 1fr;
      }
      .modal-body {
        padding: 1.25rem;
      }
    }
  </style>
</head>

    <div class="hero-inner">

      <h1>台灣常見與特色花卉圖鑑</h1>
      <p>收錄 20 種台灣山林、庭園與花市常見花卉，完整整理適合溫度、土壤介質、日照需求與澆水頻率等栽培指南。</p>
    </div>
  </header>

  <div class="controls-wrapper">
    <div class="controls-bar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜尋花名、英文名稱、學名或土壤關鍵字..." />
      </div>
      <div class="filter-group" id="filterGroup">
        <button class="filter-btn active" data-filter="all">全部花卉 (20)</button>
        <button class="filter-btn" data-filter="full-sun">☀️ 喜全日照</button>
        <button class="filter-btn" data-filter="partial-shade">🌤️ 半日照 / 散射光</button>
        <button class="filter-btn" data-filter="native">🇹🇼 台灣原生 / 特有種</button>
      </div>
    </div>
  </div>

  <div class="stats-bar">
    <span id="resultCount">顯示全部 20 種花卉</span>
    <span>💡 提示：請將照片存放於 <code>images/01.jpg</code> ～ <code>images/20.jpg</code>，或直接點擊圖片右下角「更換照片」載入本地圖檔。</span>
  </div>

  <main>
    <div class="flower-grid" id="flowerGrid"></div>
  </main>

  <!-- Detail Modal -->
  <div class="modal-backdrop" id="flowerModal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true">
      <button class="modal-close" id="modalClose" aria-label="關閉視窗">&times;</button>
      <img src="" alt="" class="modal-img" id="modalImg" />
      <div class="modal-body">
        <h2 class="modal-title" id="modalZh"></h2>
        <div class="modal-subtitle" id="modalSub"></div>
        <div class="modal-grid" id="modalGrid"></div>
        <div class="modal-notes" id="modalNotes"></div>
      </div>
    </div>
  </div>

  <footer>
    台灣花卉介紹與養護指南網頁 ｜ 資料僅供園藝栽培參考，實際養護請依台灣各地區微氣候調整
  </footer>

  <input type="file" id="hiddenFileInput" accept="image/*" style="display:none" />

    const flowerGrid = document.getElementById("flowerGrid");
    const searchInput = document.getElementById("searchInput");
    const filterGroup = document.getElementById("filterGroup");
    const resultCount = document.getElementById("resultCount");
    const hiddenFileInput = document.getElementById("hiddenFileInput");

    const modal = document.getElementById("flowerModal");
    const modalClose = document.getElementById("modalClose");
    const modalImg = document.getElementById("modalImg");
    const modalZh = document.getElementById("modalZh");
    const modalSub = document.getElementById("modalSub");
    const modalGrid = document.getElementById("modalGrid");
    const modalNotes = document.getElementById("modalNotes");

    let currentFilter = "all";
    let searchTerm = "";
    let activeUploadId = null;

    // 儲存使用者透過網頁載入的本地圖片 Blob URL
    const customImageMap = {};

    function getFilteredFlowers() {
      return flowers.filter((f) => {
        const matchFilter =
          currentFilter === "all" || f.category.includes(currentFilter);

        const q = searchTerm.trim().toLowerCase();
        const matchSearch =
          !q ||
          f.zh.toLowerCase().includes(q) ||
          f.en.toLowerCase().includes(q) ||
          f.sci.toLowerCase().includes(q) ||
          f.soil.toLowerCase().includes(q) ||
          f.sunlight.toLowerCase().includes(q) ||
          f.spots.toLowerCase().includes(q);

        return matchFilter && matchSearch;
      });
    }

    function renderCards() {
      const list = getFilteredFlowers();
      resultCount.textContent = `目前顯示 ${list.length} / ${flowers.length} 種花卉`;

      if (list.length === 0) {
        flowerGrid.innerHTML = `
          <div class="empty-state">
            <p style="font-size:1.1rem; margin-bottom:0.4rem;">找不到符合條件的花卉 🌿</p>
            <p>請嘗試更換搜尋關鍵字或切換篩選分類。</p>
          </div>
        `;
        return;
      }

      flowerGrid.innerHTML = list
        .map((f) => {
          const imgSrc = customImageMap[f.id] || f.img;
          return `
            <article class="card" data-id="${f.id}">
              <div class="card-img-wrap">
                <img src="${imgSrc}" alt="${f.zh} (${f.en})"
                  onerror="this.style.display='none'; this.nextElementSibling.classList.add('visible');" />
                <div class="img-fallback">
                  <span style="font-size:1.8rem;">🌸</span>
                  <strong>${f.zh}</strong>
                  <span>請放入 <code>${f.img}</code></span>
                </div>
                <span class="card-tag">${f.badge}</span>
                <button class="upload-photo-btn" type="button" onclick="triggerUpload(${f.id})">
                  📷 更換照片
                </button>
              </div>
              <div class="card-body">
                <div class="card-title-row">
                  <div class="card-zh">${f.zh}</div>
                  <div class="card-en">${f.en} <span class="card-sci">(${f.sci})</span></div>
                </div>
                <div class="specs-list">
                  <div class="spec-item">
                    <span class="spec-label">🌡️ 溫度</span>
                    <span class="spec-value">${f.temp}</span>
                  </div>
                  <div class="spec-item">
                    <span class="spec-label">🪴 土壤</span>
                    <span class="spec-value">${f.soil}</span>
                  </div>
                  <div class="spec-item">
                    <span class="spec-label">☀️ 日照</span>
                    <span class="spec-value">${f.sunlight}</span>
                  </div>
                  <div class="spec-item">
                    <span class="spec-label">💧 澆水</span>
                    <span class="spec-value">${f.watering}</span>
                  </div>
                </div>
                <button class="detail-btn" type="button" onclick="openModal(${f.id})">
                  查看花期與賞花情報 →
                </button>
              </div>
            </article>
          `;
        })
        .join("");
    }

    window.triggerUpload = function (id) {
      activeUploadId = id;
      hiddenFileInput.value = "";
      hiddenFileInput.click();
    };

    hiddenFileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file && activeUploadId !== null) {
        const url = URL.createObjectURL(file);
        customImageMap[activeUploadId] = url;
        renderCards();
      }
    });

    window.openModal = function (id) {
      const f = flowers.find((item) => item.id === id);
      if (!f) return;

      modalImg.src = customImageMap[f.id] || f.img;
      modalImg.alt = `${f.zh} (${f.en})`;
      modalZh.textContent = f.zh;
      modalSub.textContent = `${f.en} ｜ 學名：${f.sci}`;

      modalGrid.innerHTML = `
        <div class="modal-box">
          <h4>🌡️ 適合生長溫度</h4>
          <p>${f.temp}</p>
        </div>
        <div class="modal-box">
          <h4>☀️ 日照需求</h4>
          <p>${f.sunlight}</p>
        </div>
        <div class="modal-box">
          <h4>🪴 適合土壤介質</h4>
          <p>${f.soil}</p>
        </div>
        <div class="modal-box">
          <h4>💧 澆水頻率</h4>
          <p>${f.watering}</p>
        </div>
        <div class="modal-box">
          <h4>🗓️ 台灣常見花期</h4>
          <p>${f.season}</p>
        </div>
        <div class="modal-box">
          <h4>📍 台灣推薦賞花地點</h4>
          <p>${f.spots}</p>
        </div>
      `;

      modalNotes.innerHTML = `<strong>🌿 栽培與花卉小知識：</strong>${f.tips}`;
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
    };

    function closeModal() {
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
    }

    modalClose.addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });

    searchInput.addEventListener("input", (e) => {
      searchTerm = e.target.value;
      renderCards();
    });

    filterGroup.addEventListener("click", (e) => {
      const btn = e.target.closest(".filter-btn");
      if (!btn) return;
      filterGroup.querySelectorAll(".filter-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.dataset.filter;
      renderCards();
    });

    renderCards();
  </script>
